<div class="heart-control" data-state="{{ heart_state|default:'unavailable' }}">{% if hearts_enabled %}<form method="post" action="{{ heart_action }}">{% csrf_token %}<button class="heart-button" type="submit" aria-pressed="{% if heart_selected %}true{% else %}false{% endif %}" {% if heart_state == 'pending' %}disabled aria-busy="true"{% endif %}>{% include 'news/icons/heart.html' %}{% if heart_state == 'pending' %}Wird gespeichert …{% elif heart_selected %}Herz zurücknehmen{% else %}Gefällt mir{% endif %}<span>{{ heart_count|default:0 }}</span></button></form>{% else %}<button class="heart-button" type="button" disabled aria-describedby="heart-help">{% include 'news/icons/heart.html' %}Gefällt mir <span>{{ heart_count|default:0 }}</span></button><p id="heart-help" class="help">Herzen vergeben ist noch nicht freigeschaltet.</p>{% endif %}{% if heart_state == 'error' %}<p class="field-error" role="alert">Dein Herz konnte nicht gespeichert werden. Der bisherige Stand bleibt erhalten. Bitte versuche es erneut.</p>{% endif %}</div>
