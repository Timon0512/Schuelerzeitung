{% if page_obj.has_other_pages %}<nav class="pagination" aria-label="Seiten der Ergebnisse">{% if page_obj.has_previous %}<a rel="prev" href="?{% if is_search %}q={{ query|urlencode }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Zurück</a>{% endif %}<span>Seite {{ page_obj.number }} von {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a rel="next" href="?{% if is_search %}q={{ query|urlencode }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Weiter</a>{% endif %}</nav>{% endif %}
