{% load images %}
<article class="story{% if lead_card %} lead-story{% endif %}">{% if item.hero_image %}<a class="story-image" href="{% url 'article' item.slug %}" tabindex="-1" aria-hidden="true"><img {% if lead_card %}{% responsive_image item.hero_image sizes="(min-width: 1360px) 838px, (min-width: 1024px) calc((100vw - 104px) * 2 / 3), (min-width: 480px) calc(100vw - 48px), calc(100vw - 32px)" %}{% else %}{% responsive_image item.hero_image sizes="auto, (min-width: 1360px) 411px, (min-width: 1024px) calc((100vw - 128px) / 3), (min-width: 768px) calc((100vw - 72px) / 2), (min-width: 480px) calc(100vw - 48px), calc(100vw - 32px)" %}{% endif %} style="object-position:{{ item.hero_focus_x }}% {{ item.hero_focus_y }}%" alt="" width="{{ item.hero_image.width }}" height="{{ item.hero_image.height }}" {% if not lead_card %}loading="lazy"{% else %}fetchpriority="high"{% endif %}></a>{% endif %}<div class="story-copy"><span class="category-label">{{ item.category.name }}</span>{% if lead_card %}<h1><a href="{% url 'article' item.slug %}">{{ item.title }}</a></h1>{% else %}<h2><a href="{% url 'article' item.slug %}">{{ item.title }}</a></h2>{% endif %}{% if item.excerpt %}<p class="excerpt">{{ item.excerpt }}</p>{% endif %}{% include 'news/byline.html' with article=item reading_minutes=None %}</div></article>
