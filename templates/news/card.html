<article class="story{% if lead_card %} lead-story{% endif %}">{% if item.hero_image %}<a class="story-image" href="{% url 'article' item.slug %}" tabindex="-1" aria-hidden="true"><img src="{% url 'media' item.hero_image_id %}" alt="" width="{{ item.hero_image.width }}" height="{{ item.hero_image.height }}" {% if not lead_card %}loading="lazy"{% else %}fetchpriority="high"{% endif %}></a>{% endif %}<div class="story-copy"><span class="category-label">{{ item.category.name }}</span>{% if lead_card %}<h1><a href="{% url 'article' item.slug %}">{{ item.title }}</a></h1>{% else %}<h2><a href="{% url 'article' item.slug %}">{{ item.title }}</a></h2>{% endif %}{% if item.excerpt %}<p class="excerpt">{{ item.excerpt }}</p>{% endif %}{% include 'news/byline.html' with article=item reading_minutes=None %}</div></article>
