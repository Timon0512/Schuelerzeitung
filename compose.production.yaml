name: kaktus
services:
  web:
    image: kaktus:${KAKTUS_IMAGE_TAG:-local}
    build: .
    env_file:
      # Use the project-root .env by default. Set KAKTUS_ENV_FILE to use a
      # separate production environment file on servers that need one.
      - path: ${KAKTUS_ENV_FILE:-./.env}
        format: raw
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "false"
      DJANGO_MEDIA_ROOT: /data/private
    ports:
      - "127.0.0.1:8002:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${KAKTUS_MEDIA_DIR:-./var/private}
        target: /data/private
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    stop_grace_period: 70s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
